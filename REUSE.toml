version = 1
SPDX-PackageName = "ISEDRAF"
SPDX-PackageSupplier = "Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-PackageDownloadLocation = "https://github.com/itcmsgr/isedraf"

# Root governance and metadata files carry no inline SPDX header:
# NON_HEADER_FORMAT or prose-first documents (docs/development/HEADER_POLICY.md §7).
[[annotations]]
path = ["README.md", "NOTICE", "COPYRIGHT", "VERSION", "CHANGELOG.md", ".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# JSON and YAML: no comment syntax / strict schema. A synthetic _license key is a gate failure.
[[annotations]]
path = [".github/**", "schemas/**", "rules/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# THIRD_PARTY: reproduced verbatim, never re-stamped.
[[annotations]]
path = ["LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "Mozilla Foundation"
SPDX-License-Identifier = "MPL-2.0"

# ---------------------------------------------------------------------------------------
# Data files with no comment syntax. 182 files carried no licence statement at all -
# neither an inline header nor an annotation here - which is not a defensible state for a
# published repository, whatever the file format. Each class is named explicitly rather
# than covered by one wildcard, so that a NEW class of unlicensed file is visible as a gap
# instead of silently absorbed.
# ---------------------------------------------------------------------------------------

# Golden test vectors: raw bytes, digests and canonical serializations. A comment inside
# any of these would change the bytes being tested, which is the whole point of them.
[[annotations]]
path = ["test-vectors/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# The recorded glibc differential corpus: generated synthetic inputs and glibc's answers to
# them. JSON cannot carry an inline licence header (L-07 forbids a synthetic licence key).
[[annotations]]
path = ["tests/fixtures/glibc_differential/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# Measured compatibility records and rendered report samples: generated evidence, strict
# JSON, no comment syntax.
[[annotations]]
path = ["docs/compatibility/records/**", "docs/reference/samples/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# Freeze manifests and the marker that keeps the directory in git: digest lists, where a
# stray line would break `sha256sum -c`.
[[annotations]]
path = ["docs/architecture/freeze/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# Gate registries and allowlists: strict JSON consumed by the gates themselves. A synthetic
# _license key would be a schema violation and, in two of these, a gate failure.
[[annotations]]
path = ["scripts/ci/*.json", "scripts/ci/*.txt", "scripts/ci/*.allow"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# Package metadata templates: consumed verbatim by dpkg/rpm, which reject unknown fields.
# The built packages state MPL-2.0 in their own metadata and ship the licence text.
# packaging/deb/copyright is itself a DEP-5 licence declaration; an SPDX comment header
# inside it would be redundant and risks breaking the format dpkg parses.
[[annotations]]
path = ["packaging/deb/control.in", "packaging/rpm/isedraf.spec.in", "packaging/deb/copyright"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# ARCH-01 generated structural artifacts: Mermaid, JSON and CSV emitted by
# scripts/analysis/. They are regenerated from the code rather than hand-maintained, so an
# inline header would be rewritten on every run - and CSV and JSON have no comment syntax
# that their consumers would tolerate.
[[annotations]]
path = ["docs/development/architecture/generated/*.mmd", "docs/development/architecture/generated/*.json", "docs/development/architecture/generated/*.csv"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"

# ARCH-01 prose sources: the authored bodies that scripts/analysis/artifacts.py emits into
# the generated directory. An inline SPDX header here would be duplicated into the output,
# which already receives one from the generator.
[[annotations]]
path = ["scripts/analysis/arch01_prose/*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Antonios Voulvoulis / ITCMS <contact@itcms.gr>"
SPDX-License-Identifier = "MPL-2.0"
